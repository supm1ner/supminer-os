insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

set default=0
set timeout=3

# Black & white theme
set color_normal=white/black
set color_highlight=black/white
set menu_color_normal=white/black
set menu_color_highlight=black/white

menuentry "SupMiner OS" --class supminer --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet
    initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "SupMiner OS (fallback initramfs)" --class supminer --class gnu-linux {
    set gfxpayload=keep
    linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%
    initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-fallback.img
}
